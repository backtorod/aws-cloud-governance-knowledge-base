schema_version: "1.0"
last_reviewed: "2026-10-14"
purpose: "Curated source registry for AWS architecture, security, governance, policy-as-code, and EvidenceMark design."
authority_levels:
  aws_official: "AWS-owned guidance or reference implementation; verify current service behavior in AWS documentation."
  vendor_maintained: "Maintained by the product or engine owner."
  community_project: "Maintained open-source implementation or knowledge source."
  community_curation: "Discovery aid; not normative authority."
sources:
  - id: aws-sra-examples
    name: AWS Security Reference Architecture Examples
    url: https://github.com/aws-samples/aws-security-reference-architecture-examples
    authority: aws_official
    categories: [multi-account, security-services, delegated-administration, stacksets, terraform]
    use_for: [reference-architecture, implementation-patterns, evidence-expectations]
    ingest: metadata_and_selected_paths
    trust_note: "Reference implementation, not a substitute for current service documentation or customer validation."
  - id: aws-security-services-best-practices
    name: AWS Security Services Best Practices
    url: https://github.com/aws/aws-security-services-best-practices
    authority: aws_official
    categories: [network-security, detection, inspection, centralized-security]
    use_for: [design-rationale, service-patterns]
    ingest: metadata_and_selected_paths
  - id: aws-control-tower-controls-terraform
    name: AWS Control Tower Controls Terraform
    url: https://github.com/aws-samples/aws-control-tower-controls-terraform
    authority: aws_official
    categories: [control-tower, terraform, preventive, detective, proactive]
    use_for: [control-implementation, pipeline-patterns]
    ingest: metadata_and_selected_paths
  - id: landing-zone-accelerator
    name: Landing Zone Accelerator on AWS
    url: https://github.com/awslabs/landing-zone-accelerator-on-aws
